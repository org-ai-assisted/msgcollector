## Consumer wrapper. Docs live in the reusable:
## https://github.com/org-ai-assisted/developer-meta-files/blob/master/.github/workflows/reusable-codeql.yml

name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '15 6 * * 0'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    uses: org-ai-assisted/developer-meta-files/.github/workflows/reusable-codeql.yml@master
    with:
      language: python
      ## msgcollector's Python scripts live at usr/libexec/msgcollector/
      ## with no extension (Debian libexec convention). The CodeQL
      ## Python extractor discovers files by '.py'; ci/python-prepare.sh
      ## creates clean '<name>.py' symlinks for each shebang-declared
      ## Python script.
      prepare-command: bash ci/python-prepare.sh
    permissions:
      security-events: write
      contents: read
      packages: read
